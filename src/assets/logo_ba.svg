<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Square Background -->
  <rect width="200" height="200" rx="40" fill="#FFD600"/>
  
  <!-- "BA" Text -->
  <text 
    x="50%" 
    y="65%" 
    text-anchor="middle" 
    fill="black" 
    style="font-family: 'Inter', sans-serif; font-weight: 900; font-size: 110px; letter-spacing: -2px;"
  >BA</text>
  
  <!-- "Ciudad" Text (Optional but makes it look more official) -->
  <text 
    x="50%" 
    y="85%" 
    text-anchor="middle" 
    fill="black" 
    style="font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 2px;"
  >CIUDAD</text>
</svg>
